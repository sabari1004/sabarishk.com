<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#09090b"/>
  <!-- Ambient background glow -->
  <circle cx="600" cy="150" r="450" fill="#10b981" fill-opacity="0.12" filter="blur(100px)"/>
  <circle cx="950" cy="400" r="300" fill="#06b6d4" fill-opacity="0.08" filter="blur(90px)"/>
  
  <!-- Subtle border -->
