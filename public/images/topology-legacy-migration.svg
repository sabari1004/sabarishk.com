      <g transform="translate(0, 0)">
        <rect width="440" height="92" rx="8" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <g transform="translate(14, 14)">
          <text x="0" y="12" font-size="13" font-weight="700" fill="#f4f4f5">Syclo Work Manager 6.0 / 6.2 (Agentry)</text>
          <text x="0" y="28" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#fb7185">Proprietary Agentry Client Engine</text>
          <text x="0" y="48" font-size="11" fill="#71717a">• Monolithic 120MB+ mobile container</text>
          <text x="0" y="64" font-size="11" fill="#71717a">• Rigid screen definitions &amp; slow compilation</text>
