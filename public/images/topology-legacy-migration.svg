        <rect width="440" height="92" rx="8" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <g transform="translate(14, 14)">
          <text x="0" y="12" font-size="13" font-weight="700" fill="#f4f4f5">SAP S/4HANA Clean Core</text>
          <text x="0" y="28" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#34d399">Standard BAPIs &amp; MAIF Add-On</text>
          <text x="0" y="48" font-size="11" fill="#a1a1aa">• Cloud Connector Principal Propagation</text>
          <text x="0" y="64" font-size="11" fill="#71717a">• Zero modification to standard ERP core kernel</text>
        </g>
