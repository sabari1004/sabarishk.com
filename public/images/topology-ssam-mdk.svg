    <text x="16" y="9" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#71717a">SSAM 2505 Upgrade Lead • 65% Faster Sync • Custom MDK Native Packaging • 15,000+ Field Technicians</text>
    <text x="1070" y="9" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#34d399">sabarishk.com</text>
