  </defs>

  <rect width="1200" height="480" fill="#09090b"/>
  <rect width="1200" height="480" fill="url(#mig-glow-rose)"/>
  <rect width="1200" height="480" fill="url(#mig-glow-emerald)"/>

  <!-- Left Column: Legacy Platform Sunset (X: 40, Width: 480) -->
