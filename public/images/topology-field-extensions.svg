  <!-- FOOTER -->
  <g transform="translate(40, 458)">
    <circle cx="5" cy="5" r="3" fill="#10b981"/>
    <text x="16" y="9" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#71717a">100% Digital JSA Audits • Linear Asset GIS Mapping • Mobile Lockout/Tagout Verification (LOTO)</text>
    <text x="1070" y="9" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#34d399">sabarishk.com</text>
  </g>
</svg>