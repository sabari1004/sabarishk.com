        <g transform="translate(14, 14)">
          <text x="0" y="12" font-size="13" font-weight="700" fill="#f4f4f5">SMP 3.0 Server Infrastructure</text>
          <text x="0" y="28" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#fb7185">Complex Java Business Logic</text>
          <text x="0" y="48" font-size="11" fill="#71717a">• Entrenched OpenSearch fetch rules &amp; transaction stepping</text>
          <text x="0" y="64" font-size="11" fill="#71717a">• On-prem Windows server clusters &amp; memory bloat</text>
