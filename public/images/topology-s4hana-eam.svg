<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" style="font-family:system-ui, -apple-system, 'SF Pro Display', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <radialGradient id="eam-glow-emerald" cx="20%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eam-glow-indigo" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eam-grad-phase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="eam-grad-rsh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="eam-grad-mobile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="eam-arrow-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="eam-arrow-emerald" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="#09090b"/>
  <rect width="1200" height="580" fill="url(#eam-glow-emerald)"/>
  <rect width="1200" height="580" fill="url(#eam-glow-indigo)"/>

  <!-- TIER 1: S/4HANA EAM 9-Phase Model Governance -->
  <g transform="translate(40, 20)">
    <rect width="1120" height="135" rx="14" fill="#101015" stroke="#27272a" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="3" rx="1.5" fill="url(#eam-grad-phase)"/>

    <g transform="translate(20, 18)">
      <rect width="70" height="22" rx="5" fill="#18181f" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="35" y="15" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="middle">LAYER 01</text>
      <text x="82" y="16" font-size="15" font-weight="700" fill="#ffffff">S/4HANA EAM 9-Phase Model Lifecycle Governance</text>
      <text x="540" y="16" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">Control Gates • Automatic Back-Propagation</text>

      <g transform="translate(930, -2)">
        <rect width="150" height="24" rx="12" fill="#18181f" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="12" cy="12" r="3.5" fill="#10b981"/>
        <text x="22" y="16" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#34d399">9-PHASE MODEL</text>
      </g>
    </g>

    <!-- Phase Stepper Chevrons -->
    <g transform="translate(20, 52)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect width="200" height="65" rx="8" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <text x="14" y="24" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#10b981">PHASE 01 — 02</text>
        <text x="14" y="44" font-size="12" font-weight="700" fill="#f4f4f5">Initiation &amp; Screening</text>
      </g>
      <!-- Step 2 -->
      <g transform="translate(220, 0)">
        <rect width="200" height="65" rx="8" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <text x="14" y="24" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#10b981">PHASE 03 — 04</text>
        <text x="14" y="44" font-size="12" font-weight="700" fill="#f4f4f5">Planning &amp; Approval</text>
      </g>
      <!-- Step 3 (Gate) -->
      <g transform="translate(440, 0)">
        <rect width="200" height="65" rx="8" fill="#17171e" stroke="#06b6d4" stroke-width="1.5"/>
        <text x="14" y="24" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#38bdf8">PHASE 05 // GATE</text>
        <text x="14" y="44" font-size="12" font-weight="700" fill="#ffffff">Preparation (Parts Ready)</text>
      </g>
      <!-- Step 4 -->
      <g transform="translate(660, 0)">
        <rect width="200" height="65" rx="8" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <text x="14" y="24" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#818cf8">PHASE 06 — 07</text>
        <text x="14" y="44" font-size="12" font-weight="700" fill="#f4f4f5">Scheduling &amp; Execution</text>
      </g>
      <!-- Step 5 -->
      <g transform="translate(880, 0)">
        <rect width="200" height="65" rx="8" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <text x="14" y="24" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#818cf8">PHASE 08 — 09</text>
        <text x="14" y="44" font-size="12" font-weight="700" fill="#f4f4f5">Post-Exec &amp; Completion</text>
      </g>
    </g>
  </g>

  <!-- CONNECTOR 1 -->
  <g transform="translate(600, 155)">
    <line x1="0" y1="0" x2="0" y2="55" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#eam-arrow-blue)"/>
    <g transform="translate(-190, 14)">
      <rect width="380" height="26" rx="13" fill="#14141a" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="15" cy="13" r="3.5" fill="#38bdf8"/>
      <text x="26" y="17" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#e0f2fe">GATES PASSED: AUTO-RELEASE TO DISPATCH &amp; SCHEDULING</text>
    </g>
  </g>

  <!-- TIER 2: Resource Scheduling (MRS / RSH) -->
  <g transform="translate(40, 210)">
    <rect width="1120" height="155" rx="14" fill="#101015" stroke="#27272a" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="3" rx="1.5" fill="url(#eam-grad-rsh)"/>

    <g transform="translate(20, 18)">
      <rect width="70" height="22" rx="5" fill="#18181f" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
      <text x="35" y="15" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">LAYER 02</text>
      <text x="82" y="16" font-size="15" font-weight="700" fill="#ffffff">Resource Scheduling &amp; Capacity Leveling Engines</text>
      <text x="490" y="16" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">Work Center Balancing • Technician Dispatch</text>

      <g transform="translate(930, -2)">
        <rect width="150" height="24" rx="12" fill="#18181f" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="12" cy="12" r="3.5" fill="#06b6d4"/>
        <text x="22" y="16" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#38bdf8">MRS / RSH ENGINE</text>
      </g>
    </g>

    <g transform="translate(20, 52)">
      <!-- Card A -->
      <g transform="translate(0, 0)">
        <rect width="525" height="85" rx="10" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <g transform="translate(16, 14)">
          <circle cx="5" cy="6" r="4" fill="#06b6d4"/>
          <text x="18" y="10" font-size="13" font-weight="700" fill="#f4f4f5">SAP Multi-Resource Scheduling (MRS)</text>
          <text x="18" y="27" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#38bdf8">Qualifications, Tools &amp; Gantt Dispatch</text>
          <text x="0" y="48" font-size="11.5" fill="#a1a1aa">• Complex skill matrix &amp; specialized tool assignment</text>
          <text x="0" y="66" font-size="11.5" fill="#71717a">• Shift calendar alignment with crew rosters</text>
        </g>
      </g>
      <!-- Card B -->
      <g transform="translate(555, 0)">
        <rect width="525" height="85" rx="10" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <g transform="translate(16, 14)">
          <circle cx="5" cy="6" r="4" fill="#06b6d4"/>
          <text x="18" y="10" font-size="13" font-weight="700" fill="#f4f4f5">SAP Resource Scheduling (RSH)</text>
          <text x="18" y="27" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#38bdf8">Maintenance Scheduling Board</text>
          <text x="0" y="48" font-size="11.5" fill="#a1a1aa">• Work center capacity leveling &amp; utilization tracking</text>
          <text x="0" y="66" font-size="11.5" fill="#71717a">• Real-time dispatch schedule compliance metrics</text>
        </g>
      </g>
    </g>
  </g>

  <!-- CONNECTOR 2 -->
  <g transform="translate(600, 365)">
    <line x1="0" y1="0" x2="0" y2="55" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#eam-arrow-emerald)"/>
    <g transform="translate(-185, 14)">
      <rect width="370" height="26" rx="13" fill="#14141a" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="15" cy="13" r="3.5" fill="#10b981"/>
      <text x="26" y="17" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#34d399">MAIF DISTRIBUTION RULES • mTLS MOBILE SYNC</text>
    </g>
  </g>

  <!-- TIER 3: Field Mobile Execution & Back-Propagation -->
  <g transform="translate(40, 420)">
    <rect width="1120" height="130" rx="14" fill="#101015" stroke="#27272a" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="3" rx="1.5" fill="url(#eam-grad-mobile)"/>

    <g transform="translate(20, 18)">
      <rect width="70" height="22" rx="5" fill="#18181f" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
      <text x="35" y="15" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#a5b4fc" text-anchor="middle">LAYER 03</text>
      <text x="82" y="16" font-size="15" font-weight="700" fill="#ffffff">Field Technician SSAM Mobile Store &amp; Phase Back-Propagation</text>
      <text x="590" y="16" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">Execution ➔ TECO ➔ Completion</text>

      <g transform="translate(930, -2)">
        <rect width="150" height="24" rx="12" fill="#18181f" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="12" cy="12" r="3.5" fill="#818cf8"/>
        <text x="22" y="16" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#c7d2fe">SSAM EXECUTION</text>
      </g>
    </g>

    <g transform="translate(20, 50)">
      <g transform="translate(0, 0)">
        <rect width="525" height="65" rx="8" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <g transform="translate(14, 12)">
          <text x="0" y="14" font-size="12" font-weight="700" fill="#f4f4f5">MAIF Dispatch Filter (Queue Protection)</text>
          <text x="0" y="34" font-size="11" fill="#a1a1aa">Restricts mobile sync queue strictly to Phase: SCHED / Dispatched</text>
        </g>
      </g>
      <g transform="translate(555, 0)">
        <rect width="525" height="65" rx="8" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <g transform="translate(14, 12)">
          <text x="0" y="14" font-size="12" font-weight="700" fill="#34d399">Bi-Directional Status Back-Propagation</text>
          <text x="0" y="34" font-size="11" fill="#a1a1aa">Mobile Start/Hold/Complete events trigger automatic ERP Phase shifts to TECO</text>
        </g>
      </g>
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(40, 562)">
    <circle cx="5" cy="5" r="3" fill="#10b981"/>
    <text x="16" y="9" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#71717a">Strict 9-Phase Governance • Capacity Leveling • Bi-Directional Phase Back-Propagation • Zero Queue Saturation</text>
    <text x="1070" y="9" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#34d399">sabarishk.com</text>
  </g>
</svg>