      <!-- Card 3 -->
      <g transform="translate(730, 0)">
        <rect width="350" height="98" rx="10" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <g transform="translate(16, 16)">
          <circle cx="5" cy="6" r="4" fill="#818cf8"/>
          <text x="18" y="10" font-size="13" font-weight="700" fill="#f4f4f5">Mobile WCM Safety Lockout</text>
          <text x="18" y="27" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a5b4fc">Tag Isolation &amp; LOTO</text>
          <text x="0" y="48" font-size="11.5" fill="#a1a1aa">• Physical tag hanging &amp; normalization check</text>
          <text x="0" y="66" font-size="11.5" fill="#71717a">• Zero-energization safety interlocks</text>
        </g>
      </g>
    </g>
  </g>

  <!-- INTER-TIER CONNECTOR -->
  <g transform="translate(600, 199)">
    <line x1="0" y1="0" x2="0" y2="65" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#ext-arrow)"/>
    <g transform="translate(-185, 17)">
      <rect width="370" height="28" rx="14" fill="#14141a" stroke="#06b6d4" stroke-width="1.3"/>
      <circle cx="16" cy="14" r="3.5" fill="#06b6d4"/>
      <text x="28" y="18" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#e0f2fe">SPATIAL &amp; SAFETY DELTA COMMITS • ODATA V4</text>
    </g>
  </g>

  <!-- TIER 2: Safety & Geospatial Enterprise Servers -->
  <g transform="translate(40, 264)">
    <rect width="1120" height="175" rx="14" fill="#101015" stroke="#27272a" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="3" rx="1.5" fill="url(#ext-grad-backend)"/>

    <g transform="translate(20, 20)">
      <rect width="70" height="22" rx="5" fill="#18181f" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
      <text x="35" y="15" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">LAYER 02</text>
      <text x="82" y="16" font-size="15" font-weight="700" fill="#ffffff">Backend Safety, Geospatial &amp; Compliance Servers</text>
      <text x="490" y="16" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">ArcGIS Enterprise • S/4HANA WCM • EHS Regulatory</text>

      <g transform="translate(930, -2)">
        <rect width="150" height="24" rx="12" fill="#18181f" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="12" cy="12" r="3.5" fill="#818cf8"/>
        <text x="22" y="16" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#c7d2fe">ENTERPRISE HUB</text>
      </g>
    </g>

    <g transform="translate(20, 56)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="345" height="98" rx="10" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <g transform="translate(16, 16)">
          <circle cx="5" cy="6" r="4" fill="#10b981"/>
          <text x="18" y="10" font-size="13" font-weight="700" fill="#f4f4f5">ArcGIS Enterprise Server</text>
          <text x="18" y="27" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#34d399">Spatial Feature Service</text>
          <text x="0" y="48" font-size="11.5" fill="#a1a1aa">• Feature layer delta replication &amp; sync</text>
          <text x="0" y="66" font-size="11.5" fill="#71717a">• High-precision GIS coordinate geocoding</text>
        </g>
      </g>
      <!-- Card 2 -->
      <g transform="translate(365, 0)">
        <rect width="345" height="98" rx="10" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <g transform="translate(16, 16)">
          <circle cx="5" cy="6" r="4" fill="#06b6d4"/>
          <text x="18" y="10" font-size="13" font-weight="700" fill="#f4f4f5">S/4HANA WCM Engine</text>
          <text x="18" y="27" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#38bdf8">Isolation &amp; Certificates</text>
          <text x="0" y="48" font-size="11.5" fill="#a1a1aa">• Operational work clearance generation</text>
          <text x="0" y="66" font-size="11.5" fill="#71717a">• Safety isolation tag issuance &amp; printing</text>
        </g>
      </g>
      <!-- Card 3 -->
      <g transform="translate(730, 0)">
        <rect width="350" height="98" rx="10" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <g transform="translate(16, 16)">
          <circle cx="5" cy="6" r="4" fill="#818cf8"/>
          <text x="18" y="10" font-size="13" font-weight="700" fill="#f4f4f5">EHS Regulatory Compliance Hub</text>
          <text x="18" y="27" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a5b4fc">OSHA &amp; Regulatory Audits</text>
          <text x="0" y="48" font-size="11.5" fill="#a1a1aa">• Complete tamper-evident inspection log</text>
          <text x="0" y="66" font-size="11.5" fill="#71717a">• OSHA compliance reporting &amp; hazard history</text>
        </g>
      </g>
    </g>
