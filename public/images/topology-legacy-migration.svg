          <text x="0" y="28" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#34d399">Modern Cross-Platform Client</text>
          <text x="0" y="48" font-size="11" fill="#a1a1aa">• Lightweight &lt;25MB binary for iOS &amp; Android</text>
          <text x="0" y="64" font-size="11" fill="#71717a">• Clean JSON metadata &amp; JavaScript/TypeScript rules</text>
