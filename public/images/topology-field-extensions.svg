<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" style="font-family:system-ui, -apple-system, 'SF Pro Display', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <radialGradient id="ext-glow-emerald" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ext-glow-indigo" cx="80%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ext-grad-mobile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ext-grad-backend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <marker id="ext-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#06b6d4"/>
    </marker>
  </defs>

  <rect width="1200" height="480" fill="#09090b"/>
  <rect width="1200" height="480" fill="url(#ext-glow-emerald)"/>
  <rect width="1200" height="480" fill="url(#ext-glow-indigo)"/>

  <!-- TIER 1: SSAM Field Crew Operations Console -->
  <g transform="translate(40, 24)">
    <rect width="1120" height="175" rx="14" fill="#101015" stroke="#27272a" stroke-width="1.5"/>
    <rect x="0" y="0" width="1120" height="3" rx="1.5" fill="url(#ext-grad-mobile)"/>

    <g transform="translate(20, 20)">
      <rect width="70" height="22" rx="5" fill="#18181f" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="35" y="15" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="middle">LAYER 01</text>
      <text x="82" y="16" font-size="15" font-weight="700" fill="#ffffff">SSAM Field Crew Operations Console (Mobile Device)</text>
      <text x="500" y="16" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">Esri GIS Map • Dynamic Safety Forms • Mobile WCM</text>

      <g transform="translate(930, -2)">
        <rect width="150" height="24" rx="12" fill="#18181f" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="12" cy="12" r="3.5" fill="#10b981"/>
        <text x="22" y="16" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#34d399">MOBILE SUITE</text>
      </g>
    </g>

    <g transform="translate(20, 56)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="345" height="98" rx="10" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <g transform="translate(16, 16)">
          <circle cx="5" cy="6" r="4" fill="#10b981"/>
          <text x="18" y="10" font-size="13" font-weight="700" fill="#f4f4f5">Esri / SAP GEF Spatial Map</text>
          <text x="18" y="27" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#34d399">Linear Pipelines &amp; Grids</text>
          <text x="0" y="48" font-size="11.5" fill="#a1a1aa">• Linear Asset Management (LAM) mapping</text>
          <text x="0" y="66" font-size="11.5" fill="#71717a">• Offline vector tile caching &amp; GPS navigation</text>
        </g>
      </g>
      <!-- Card 2 -->
      <g transform="translate(365, 0)">
        <rect width="345" height="98" rx="10" fill="#17171e" stroke="#27272a" stroke-width="1.2"/>
        <g transform="translate(16, 16)">
          <circle cx="5" cy="6" r="4" fill="#06b6d4"/>
          <text x="18" y="10" font-size="13" font-weight="700" fill="#f4f4f5">Mirata &amp; SAP Dynamic Forms</text>
          <text x="18" y="27" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#38bdf8">Digital Safety Checks (JSA)</text>
          <text x="0" y="48" font-size="11.5" fill="#a1a1aa">• Conditional validation rules &amp; risk matrix</text>
          <text x="0" y="66" font-size="11.5" fill="#71717a">• Photo attachments &amp; inspector signatures</text>
