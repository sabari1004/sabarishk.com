      <text x="75" y="17" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">METADATA RETROFIT</text>
    </g>
    <g transform="translate(-75, 20)">
